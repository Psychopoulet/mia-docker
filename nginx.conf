# Included inside http { } by /etc/nginx/nginx.conf — do not add a top-level `events` block here.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream mia_upstream {
    server mia:8000;
}

server {

    listen 80 default_server;
    listen [::]:80 default_server;
    server_name mia.localhost;

    location / {
        proxy_pass http://mia_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

}

upstream warcraft3sounds_upstream {
    server warcraft3sounds:8000;
}

server {

    listen 80;
    listen [::]:80;
    server_name warcraft3sounds.localhost;

    # Root URL is "/" — a path prefix like /warcraft3sounds would never match the homepage.
    location / {
        proxy_pass http://warcraft3sounds_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

}

upstream goatcounter_upstream {
    server goatcounter:8080;
}

server {

    listen 80;
    listen [::]:80;
    server_name stats.localhost;

    location / {
        proxy_pass http://goatcounter_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

}

services:

  nginx:
    image: nginx:alpine # alpine => more lightweight than the full nginx image
    container_name: nginx
    ports:
      - 80:80
      # - 443:443 # need to add SSL certificate and key
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      # - ./certs/fullchain.pem:/etc/nginx/ssl/fullchain.pem:ro
      # - ./certs/privkey.pem:/etc/nginx/ssl/privkey.pem:ro
    depends_on:
      - mia
      - warcraft3sounds
    restart: unless-stopped

  mia:
    build: ../mia
    container_name: mia
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    environment:
      - NODE_ENV=production
    volumes:
      - ${USER_PATH}/mia/data/:/root/mia/data/
      - ${USER_PATH}/mia/plugins/:/root/mia/plugins/

  warcraft3sounds:
    build: ../warcraft3sounds
    container_name: warcraft3sounds
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    environment:
      - NODE_ENV=production
    volumes:
      - ${USER_PATH}/warcraft3sounds/sounds/:/root/warcraft3sounds/sounds/
      - ${USER_PATH}/warcraft3sounds/logs/:/root/warcraft3sounds/logs/

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: goatcounter
      POSTGRES_PASSWORD: ${GOAT_DB_PASSWORD}
      POSTGRES_DB: goatcounter
    volumes:
      - ${USER_PATH}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goatcounter -d goatcounter"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  goatcounter:
    image: arp242/goatcounter
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # First site: open http://localhost:8080 or run
      # docker compose exec goatcounter goatcounter db create site -vhost=... -user.email=...
      GOATCOUNTER_DB: "postgresql+postgresql://goatcounter:${GOAT_DB_PASSWORD}@db:5432/goatcounter?sslmode=disable"
      GOATCOUNTER_LISTEN: ":8080"
      GOATCOUNTER_TLS: "http"
    volumes:
      - ${USER_PATH}/goatcounter/app-data:/home/goatcounter/goatcounter-data

services:

  nginx:
    image: nginx:alpine # alpine => more lightweight than the full nginx image
    container_name: nginx
    ports:
      - 80:80
      - 443:443 # TLS for host traffic only; backends on the Docker network stay HTTP
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certs/fullchain.pem:/etc/nginx/ssl/fullchain.pem:ro
      - ./certs/privkey.pem:/etc/nginx/ssl/privkey.pem:ro
    depends_on:
      mia:
        condition: service_healthy
      warcraft3sounds:
        condition: service_healthy
      goatcounter:
        condition: service_healthy
    restart: unless-stopped

  mia:
    build: ../mia
    container_name: mia
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    environment:
      - NODE_ENV=production
    volumes:
      - ${USER_PATH}/mia/data/:/root/mia/data/
      - ${USER_PATH}/mia/plugins/:/root/mia/plugins/

  warcraft3sounds:
    build: ../warcraft3sounds
    container_name: warcraft3sounds
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    environment:
      - NODE_ENV=production
    volumes:
      - ${USER_PATH}/warcraft3sounds/sounds/:/root/warcraft3sounds/sounds/
      - ${USER_PATH}/warcraft3sounds/logs/:/root/warcraft3sounds/logs/

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: goatcounter
      POSTGRES_PASSWORD: ${GOAT_DB_PASSWORD}
      POSTGRES_DB: goatcounter
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goatcounter -d goatcounter"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  goatcounter:
    image: arp242/goatcounter
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    environment:
      # First site: http://stats.localhost or
      # docker compose exec goatcounter goatcounter db create site -vhost=stats.localhost -user.email=...
      # PG* avoids putting the password in a URL (special chars break net/url userinfo).
      GOATCOUNTER_DB: postgresql+
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: goatcounter
      PGUSER: goatcounter
      PGPASSWORD: ${GOAT_DB_PASSWORD}
      PGSSLMODE: disable
      GOATCOUNTER_LISTEN: ":8080"
      GOATCOUNTER_TLS: "http"
    volumes:
      - ${USER_PATH}/goatcounter/app-data:/home/goatcounter/goatcounter-data

volumes:
  postgres-data:
